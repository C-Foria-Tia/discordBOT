name: Run Discord Bot Roomba

# 【起動タイミング】
# 1. コードがPushされたとき
# 2. 手動でボタンを押したとき
# 3. 定期実行（6時間ごとに自動再起動して常駐させる設定）
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. コードを取得
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境をセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 必要なライブラリ（discord.py）をインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install discord.py

  # 4. Botを実行（タイムアウト時間を明示）
    - name: Run Discord Bot
      timeout-minutes: 350
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: python main.py