name: Run Discord Bot

on:
  schedule:
    # 5時間45分（345分）ごとに自動実行
    - cron: '45 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py

      - name: Run Discord Bot
        id: run_bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          # 実行ログと終了コードをキャプチャ
          python main.py > bot_output.log 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          exit $EXIT_CODE
        # エラーが起きてもワークフローを中断せず、通知処理へ進める
        continue-on-error: true

      - name: Send Notification to Discord Channel
        if: always()
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LOG_CHANNEL_ID: "1531955600819359808"
          RUN_OUTCOME: ${{ steps.run_bot.outcome }}
          BOT_EXIT_CODE: ${{ env.EXIT_CODE }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import random
          import discord
          import asyncio

          token = os.getenv("DISCORD_TOKEN")
          channel_id = int(os.getenv("LOG_CHANNEL_ID"))
          outcome = os.getenv("RUN_OUTCOME", "failure")
          exit_code_str = os.getenv("BOT_EXIT_CODE", "1")

          try:
              exit_code = int(exit_code_str)
          except ValueError:
              exit_code = 1

          log_content = ""
          if os.path.exists("bot_output.log"):
              with open("bot_output.log", "r", encoding="utf-8", errors="ignore") as f:
                  log_content = f.read()

          # ANSI エスケープシーケンス定数
          RST = "\033[0m"
          WHT = "\033[37m"
          RED = "\033[31m"
          GRN = "\033[32m"
          YEL = "\033[33m"

          if outcome == "success":
              desc = (
                  f"```ansi\n"
                  f"{WHT}[{RST} {GRN} OK {RST}{WHT}]{RST} {WHT}Stopped Roomba Control Daemon.{RST}\n"
                  f"{WHT}[{RST} {GRN} OK {RST}{WHT}]{RST} {WHT}Reached target System Power-Off.{RST}\n"
                  f"```"
              )
          elif outcome == "cancelled":
              desc = (
                  f"```ansi\n"
                  f"{WHT}[{RST} {YEL}****{RST}{WHT}]{RST} {WHT}Roomba Control Daemon execution cancelled.{RST}\n"
                  f"{WHT}[{RST} {YEL} WARN {RST}{WHT}]{RST} {WHT}Received cancellation signal from user or system.{RST}\n"
                  f"```"
              )
          else:
              # 1. SyntaxError や Syntax / Import 周りの初動エラー（インポート到達前）
              if "SyntaxError" in log_content or "IndentationError" in log_content:
                  err_module = "PyParser_ASTFromFileObject"
                  err_msg = "Invalid python syntax detected before module import"
                  hex_code = "0x00000080"
                  rip_addr = "0xffffffff8100a012"
                  bios_bug = "ACPI: [Firmware Bug]: Your BIOS is broken; FW bug workaround enabled."

              # 2. ModuleNotFoundError（import 試行時）
              elif "ModuleNotFoundError" in log_content or "ImportError" in log_content:
                  err_module = "PyImport_ImportModuleLevelObject"
                  err_msg = "Required library dependency missing from environment"
                  hex_code = "0x00000002"
                  rip_addr = "0xffffffff8101f9b8"
                  bios_bug = "ACPI: [Firmware Bug]: Your BIOS is broken; replace hardware immediately."

              # 3. 認証エラー (discord.py 実行中)
              elif "LoginFailure" in log_content or "Improper token" in log_content:
                  err_module = "discord_auth_login"
                  err_msg = "Invalid or expired authentication token"
                  hex_code = "0x00000001"
                  rip_addr = "0xffffffff8124a102"
                  bios_bug = "ACPI: [Firmware Bug]: ACPI: BIOS _OSI(Linux) query ignored"

              # 4. その他・ロジック例外
              else:
                  err_module = "roomba_bot_main_crash"
                  err_msg = "Unhandled exception in bot runtime"
                  hex_code = f"0x{exit_code & 0xFFFFFFFF:08x}"
                  rip_addr = f"0xffffffff81{random.randint(0x100000, 0xFFFFFF):06x}"
                  bios_bug = "ACPI: [Firmware Bug]: Your BIOS is broken; FW bug workaround enabled."

              rnd_ino = random.randint(1000000, 9999999)
              rnd_blk = random.randint(10000, 99999)

              desc = (
                  f"```ansi\n"
                  f"{WHT}[    0.000000] [Firmware Bug]: ACPI: BIOS _OSI(Linux) query ignored{RST}\n"
                  f"{WHT}[    0.000000] ACPI BIOS Error (bug): Could not resolve symbol [\\_SB.PCI0._OSC], AE_NOT_FOUND{RST}\n"
                  f"{WHT}[    0.052144] {bios_bug}{RST}\n"
                  f"{WHT}[    1.849201] VFS: Cannot open root device \"/dev/discord/bot-env\" or unknown-block(0,0): error -{exit_code}{RST}\n"
                  f"{WHT}[    1.849265] Please check system environment; cause: {err_msg}{RST}\n"
                  f"{WHT}[    1.849312] Kernel panic - not syncing: VFS: Unable to mount roomba-bot environment on unknown-block(0,0){RST}\n"
                  f"{WHT}[    1.849370] CPU: 0 PID: 1 Comm: roomba-bot Not tainted 6.1.0-18-amd64 #1 Debian 6.1.76-1{RST}\n"
                  f"{WHT}[    1.849400] RIP: 0010:[<{rip_addr}>] {err_module}+0x12/0x80{RST}\n"
                  f"{WHT}[    1.849420] Call Trace:{RST}\n"
                  f"{WHT}[    1.849435]  <TASK>{RST}\n"
                  f"{WHT}[    1.849451]  dump_stack_lvl+0x44/0x5c{RST}\n"
                  f"{WHT}[    1.849480]  panic+0x118/0x2e4{RST}\n"
                  f"{WHT}[    1.849509]  {err_module}+0x42/0x1e8{RST}\n"
                  f"{WHT}[    1.849542]  python_main_entry+0x80/0x100{RST}\n"
                  f"{WHT}[    1.849574]  python_runtime_init+0x110/0x250{RST}\n"
                  f"{WHT}[    1.849638]  ret_from_fork+0x1f/0x30{RST}\n"
                  f"{WHT}[    1.849667]  </TASK>{RST}\n"
                  f"{WHT}[    2.108432] Kernel panic - not syncing: Attempted to kill roomba-daemon! exitcode={hex_code}{RST}\n"
                  f"{WHT}[    2.108491] CPU: 2 PID: 1 Comm: roomba-bot Tainted: G        W          6.1.0-18-amd64{RST}\n"
                  f"{WHT}[    2.108871] Kernel Offset: disabled{RST}\n"
                  f"{WHT}[    2.108900] ---[ end Kernel panic - not syncing: Attempted to kill roomba-daemon! exitcode={hex_code} ]---{RST}\n"
                  f"{WHT}[{RST}{RED} FAILED {RST}{WHT}]{RST} {WHT}Failed to start Roomba Control Daemon service.{RST}\n"
                  f"{WHT}[{RST}{YEL} DEPEND {RST}{WHT}]{RST} {WHT}Dependency failed for Discord Gateway Connection.{RST}\n"
                  f"{WHT}[{RST}{YEL} DEPEND {RST}{WHT}]{RST} {WHT}Dependency failed for Cleanup Local Workspace Cache.{RST}\n"
                  f"{WHT}EXT4-fs error (device sda2): ext4_lookup:1845: inode #2: comm roomba-bot: deleted inode referenced: {rnd_ino}{RST}\n"
                  f"{WHT}EXT4-fs error (device sda2): ext4_dirty_inode:5943: inode #2: block {rnd_blk}: comm discord.py: core dump failed{RST}\n"
                  f"{WHT}Aborting journal on device sda2-8.{RST}\n"
                  f"{WHT}EXT4-fs (sda2): Remounting filesystem read-only{RST}\n"
                  f"```"
              )

          intents = discord.Intents.default()
          client = discord.Client(intents=intents)

          @client.event
          async def on_ready():
              try:
                  channel = client.get_channel(channel_id)
                  if channel:
                      embed = discord.Embed(description=desc)
                      await channel.send(embed=embed)
              except Exception as e:
                  print(f"Failed to send log notification: {e}")
              finally:
                  await client.close()

          if token:
              asyncio.run(client.start(token))
          EOF
