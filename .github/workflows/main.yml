name: Run Discord Bot Roomba

# 【起動タイミング】
# 1. コードがPushされたとき
# 2. 手動でボタンを押したとき
# 3. 定期実行（6時間ごとに自動再起動して常駐させる設定）
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# 同時実行の制御：新しい実行が始まったら前のジョブをキャンセル（メール飛ばさず終了させる）
concurrency:
  group: roomba-bot-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. コードを取得
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境をセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 必要なライブラリ（discord.py）をインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install discord.py

    # 4. Botを実行（タイムアウト/キャンセルが発生してもエラーにしない）
    - name: Run Discord Bot
      id: run_bot
      timeout-minutes: 350
      continue-on-error: true
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: python main.py

    # 5. キャンセル時・タイムアウト時でも強制的にSuccessステータスで終了（メール通知の遮断）
    - name: Ensure Clean Exit
      if: always()
      run: |
        echo "Bot execution cycle completed. Enforcing success status to prevent error emails."
        exit 0
